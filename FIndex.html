<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Fstyle.css">
</head>

<body>
    <header>
        <h1> Rock, Paper and Scissor</h1>
    </header>
    <div id="score-board" class="score-board">
        <div id="user-label" class="badge"> User  </div>
        <div id="Computer-label" class="badge">Computer</div>
        <span id="user-scored">0</span> : <span id="computer-scored">0</span>
    </div>
    <div class="result">
        <p id="result">Paper Covers Rock, You win</p>
    </div>

    <div class="choices">
        <div id="rock" class="choice">
            <img src="https://images.rawpixel.com/image_800/cHJpdmF0ZS9sci9pbWFnZXMvd2Vic2l0ZS8yMDIyLTEyL2pvYjk1OS1lbGVtZW50LWItMDEzNi14XzEuanBn.jpg"
                alt="Rock Image" width="48" height="48">
        </div>

        <div id="scissors" class="choice">
            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20210705223721/scissor.jpeg"
                alt="scissors  Image" width="48" height="48">
        </div>

        <div id="paper" class="choice">
            <img src="https://media.geeksforgeeks.org/wp-content/uploads/20210705223645/paper.jpeg"
                alt="paper  Image" width="48" height="48">
        </div>
        <p id="action-message">Take an Action</p>
    </div> 
    <script src="Fmain.js"></script>
</body>

</html>
